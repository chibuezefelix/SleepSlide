[versions]
agp = "9.3.1"
coreKtx = "1.10.1"
junit = "4.13.2"
junitVersion = "1.1.5"
espressoCore = "3.5.1"
lifecycleRuntimeKtx = "2.6.1"
activityCompose = "1.8.0"
composeBom = "2026.02.01"

#kotlin                  = "2.0.21"
kotlin = "2.2.10"
#agp                     = "8.6.1"

ksp                     = "2.0.21-1.0.27"
lifecycle               = "2.8.6"
navigationCompose       = "2.8.2"
#hilt                    = "2.52"
hilt                     = "2.59.2"
hiltWork = "1.2.0"
hiltNavigationCompose   = "1.2.0"
room                    = "2.6.1"
datastore               = "1.1.1"
media3                  = "1.4.1"   # ExoPlayer + MediaSessionService
workManager             = "2.9.1"
revenuecat              = "7.12.0"
coroutines              = "1.9.0"
splashscreen            = "1.0.1"
junitExt                = "1.2.1"
espresso                = "3.6.1"
turbine                 = "1.1.0"   # Flow testing
mockk                   = "1.13.12"
coroutinesTest          = "1.9.0"

[libraries]
kotlin-stdlib           = { group = "org.jetbrains.kotlin", name = "kotlin-stdlib", version.ref = "kotlin" }
coroutines-core         = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core",    version.ref = "coroutines" }
coroutines-android      = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
#compose-bom             = { group = "androidx.compose", name = "compose-bom",            version.ref = "composeBom" }
compose-ui              = { group = "androidx.compose.ui",  name = "ui" }
compose-ui-graphics     = { group = "androidx.compose.ui",  name = "ui-graphics" }
compose-ui-tooling      = { group = "androidx.compose.ui",  name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-material3       = { group = "androidx.compose.material3", name = "material3" }
compose-foundation      = { group = "androidx.compose.foundation", name = "foundation" }
compose-animation       = { group = "androidx.compose.animation", name = "animation" }
activity-compose        = { group = "androidx.activity",    name = "activity-compose", version.ref = "activityCompose" }

androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
#androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }


lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime-compose   = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose",   version.ref = "lifecycle" }
lifecycle-service           = { group = "androidx.lifecycle", name = "lifecycle-service",            version.ref = "lifecycle" }

navigation-compose      = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }

hilt-android            = { group = "com.google.dagger", name = "hilt-android",           version.ref = "hilt" }
hilt-compiler           = { group = "com.google.dagger", name = "hilt-android-compiler",  version.ref = "hilt" }
hilt-work               = { group = "androidx.hilt",  name = "hilt-work",        version.ref = "hiltWork" }
hilt-work-compiler      = { group = "androidx.hilt",  name = "hilt-compiler",    version.ref = "hiltWork" }
hilt-navigation-compose = { group = "androidx.hilt",     name = "hilt-navigation-compose", version.ref = "hiltNavigationCompose" }

room-runtime            = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx                = { group = "androidx.room", name = "room-ktx",     version.ref = "room" }
room-compiler           = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
datastore-preferences   = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
media3-exoplayer        = { group = "androidx.media3", name = "media3-exoplayer",         version.ref = "media3" }
media3-session          = { group = "androidx.media3", name = "media3-session",            version.ref = "media3" }
media3-ui               = { group = "androidx.media3", name = "media3-ui",                version.ref = "media3" }
media3-common           = { group = "androidx.media3", name = "media3-common",            version.ref = "media3" }

workmanager-ktx         = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "workManager" }


revenuecat              = { group = "com.revenuecat.purchases", name = "purchases",      version.ref = "revenuecat" }
revenuecat-ui           = { group = "com.revenuecat.purchases", name = "purchases-ui",   version.ref = "revenuecat" }

splashscreen            = { group = "androidx.core", name = "core-splashscreen", version.ref = "splashscreen" }

junit                   = { group = "junit",          name = "junit",                                  version.ref = "junit" }
junit-ext               = { group = "androidx.test.ext", name = "junit",                              version.ref = "junitExt" }
espresso-core           = { group = "androidx.test.espresso", name = "espresso-core",                 version.ref = "espresso" }
compose-ui-test-junit4  = { group = "androidx.compose.ui", name = "ui-test-junit4" }
compose-ui-test-manifest= { group = "androidx.compose.ui", name = "ui-test-manifest" }
turbine                 = { group = "app.cash.turbine", name = "turbine",                             version.ref = "turbine" }
mockk                   = { group = "io.mockk",        name = "mockk",                               version.ref = "mockk" }
coroutines-test         = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test",       version.ref = "coroutinesTest" }


[bundles]

# Convenient shorthand — reference in build.gradle.kts with libs.bundles.*
compose                 = ["compose-ui", "compose-ui-graphics", "compose-ui-tooling-preview", "compose-material3", "compose-foundation", "compose-animation", "activity-compose"]

lifecycle               = ["lifecycle-viewmodel-compose", "lifecycle-runtime-compose", "lifecycle-service"]

media3                  = ["media3-exoplayer", "media3-session", "media3-ui", "media3-common"]

room                    = ["room-runtime", "room-ktx"]

revenuecat              = ["revenuecat", "revenuecat-ui"]

coroutines              = ["coroutines-core", "coroutines-android"]

test-unit               = ["junit", "mockk", "coroutines-test", "turbine"]
test-android            = ["junit-ext", "espresso-core", "compose-ui-test-junit4"]


[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }

kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }

ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
#kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" } // Not needed  since using the new Kotlin DSL plugin management in settings.gradle.kts
#google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }





